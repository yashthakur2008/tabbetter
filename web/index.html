<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TabBetter — Your tournament, clearly.</title>
    <meta
      name="description"
      content="Explore debate tournaments, pairings, entries and judges in one clear workspace."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link btn" href="#app">Skip to tournament workspace</a>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="#discover" class="brand" aria-label="TabBetter home"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" role="presentation" focusable="false"><path d="M4 7a3 3 0 0 1 3-3h7v15H9l-5 4z" fill="currentColor" opacity=".55"/><path d="M28 12a3 3 0 0 0-3-3h-7v15h5l5 4z" fill="currentColor"/><path d="M16 2v28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/></svg></span>TabBetter<span class="brand-period">.</span></a>
        <nav class="primary-nav" aria-label="Main navigation">
          <button data-nav="discover">Tournaments</button>
          <button data-nav="saved">Saved</button>
          <button data-nav="circuits">Circuits</button>
          <button data-nav="results">Results</button>
          <button data-nav="rankings">Rankings</button>
          <details class="more-nav"><summary>More <span aria-hidden="true">⌄</span></summary>
            <div class="more-menu">
              <button data-nav="judging">Judging</button>
              <button data-nav="paradigms">Paradigms</button>
              <button data-nav="account">School &amp; registration</button>
              <button data-nav="help">Help &amp; resources</button>
              <a href="#about">About TabBetter</a>
            </div>
          </details>
        </nav>
        <div class="header-actions">
          <label class="visually-hidden" for="theme">Color theme</label><select id="theme" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option><option value="midnight">Midnight</option></select>
          <a class="btn primary-action" href="https://www.tabroom.com/user/home.mhtml" target="_blank" rel="noopener">My Tabroom ↗</a>
        </div>
      </div>
    </header>
    <main>
      <div class="workspace-context"><span>TabBetter</span><span aria-hidden="true">/</span><strong id="crumb">Tournaments</strong><span class="workspace-status">Independent · Public Tabroom data</span></div>
      <div class="content" id="app" tabindex="-1">
        <div class="loading">Connecting to Tabroom…</div>
      </div>
    </main>
    <div class="toast" role="status" aria-live="polite"></div>
    <dialog id="jump">
      <h2>Open a tournament</h2>
      <p>Paste a Tabroom tournament link or enter its ID.</p>
      <form id="jump-form">
        <label for="jump-url" class="smalltext">Tournament URL or ID</label
        ><input
          id="jump-url"
          required
          placeholder="https://www.tabroom.com/…?tourn_id=41209"
        />
        <div style="display: flex; justify-content: flex-end; gap: 10px">
          <button type="button" class="btn" id="jump-cancel">Cancel</button
          ><button class="btn dark">Open tournament</button>
        </div>
      </form>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
