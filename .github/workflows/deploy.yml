name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check repository hygiene and source syntax
        run: node scripts/check-repository.mjs
      - name: Run parser tests
        run: node --test tests/data.test.mjs
      - name: Build the self-contained Worker
        run: bash scripts/build.sh
      - name: Run runtime regression tests
        run: node --test tests/runtime.test.mjs
      - name: Validate the deployable artifact
        run: node scripts/validate-artifact.mjs
      - name: Confirm deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::CLOUDFLARE_API_TOKEN is not set; skipping publish. See docs/deployment.md.'
          fi
      - name: Publish to Cloudflare
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
