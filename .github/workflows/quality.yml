name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check repository hygiene and source syntax
        run: node scripts/check-repository.mjs
      - name: Run parser tests
        if: ${{ hashFiles('tests/data.test.mjs') != '' }}
        run: node --test tests/data.test.mjs
      - name: Build the self-contained Worker
        if: ${{ hashFiles('src/server.mjs') != '' }}
        run: bash scripts/build.sh
      - name: Run runtime regression tests
        if: ${{ hashFiles('tests/runtime.test.mjs') != '' }}
        run: node --test tests/runtime.test.mjs
      - name: Validate the deployable artifact
        if: ${{ hashFiles('scripts/validate-artifact.mjs') != '' }}
        run: node scripts/validate-artifact.mjs
